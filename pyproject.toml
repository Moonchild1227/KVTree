[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kvtree"
version = "0.1.0"
description = "Live KV radix tree observability for SGLang under agentic workloads"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "pyzmq>=25",
    "msgspec>=0.18",
]

[project.optional-dependencies]
# only the SWE replay example needs these
examples = ["httpx>=0.27", "pandas>=2.0", "pyarrow>=14"]
dev = ["pytest>=8"]

[project.scripts]
kvtree = "kvtree.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kvtree = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
